[project]
name = "doc-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2",
    "PyYAML>=6",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "pypdfium2>=4",
    "sqlite-vec>=0.1.6",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4", "ruff>=0.9", "mypy>=1.13", "types-PyYAML", "types-requests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["sqlite_vec", "pypdfium2"]
ignore_missing_imports = true
